<title>Aura Knight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: a full-screen canvas runner; every menu is a gilded wooden panel floating over the running castle scene. */
:root {
  --ink: #120d09;
  --wood: #3d2b1b;
  --wood-2: #241910;
  --gold: #e6bb5a;
  --gold-deep: #8d6a28;
  --parch: #f4e7c5;
  --green: #62c24c;
  --green-deep: #2c7420;
  --aura: #b26bff;
  --gem: #2fd27a;
  --red: #ef4f4f;
  --blue: #4aa3ff;
  --text: #fff5df;
  --muted: #cdb88d;
  --f-display: 'Luckiest Guy', Impact, 'Arial Black', sans-serif;
  --f-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--f-body); font-weight: 800; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
[hidden] { display: none !important; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--parch); outline-offset: 2px; }

.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto; background: rgba(12, 7, 3, .58);
}
.screen.clear { background: transparent; pointer-events: none; }
.screen.clear > * { pointer-events: auto; }

/* top resource bar */
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bar .spacer { flex: 1; }
.res { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 10px; border-radius: 10px; background: linear-gradient(var(--wood), var(--wood-2)); border: 2px solid var(--gold-deep); box-shadow: inset 0 0 0 1px rgba(255,220,140,.15); font-variant-numeric: tabular-nums; font-size: 15px; }
.res b { min-width: 2.5em; }
.res .plus { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(#7fdc63, var(--green-deep)); border: 1px solid #1c4d14; font-family: var(--f-display); font-size: 18px; line-height: 26px; color: #fff; }
.res small { color: var(--muted); font-size: 11px; margin-right: 4px; }
.res:not(:has(.plus)) { padding-right: 10px; }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(#f1c96a, #b4862f); border: 2px solid #6d4f17; box-shadow: 0 3px 0 #4a3510; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; color: #3a2508; }

.ico { display: inline-block; flex: none; }
.ico.aura { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 14%, #d6a8ff 30%, #7a2fe0 72%); box-shadow: 0 0 8px var(--aura); }
.ico.gem { width: 12px; height: 12px; margin: 0 2px; transform: rotate(45deg); border-radius: 2px; background: linear-gradient(135deg, #b5ffd4, var(--gem) 55%, #0f7a40); box-shadow: 0 0 6px rgba(47,210,122,.7); }
.ico.bolt { width: 12px; height: 18px; background: #ffd23f; clip-path: polygon(60% 0, 0 58%, 42% 58%, 30% 100%, 100% 38%, 56% 38%); }
.ico.ad { padding: 1px 4px; border-radius: 4px; background: #ffd23f; color: #3a2508; font-size: 10px; font-weight: 900; letter-spacing: .04em; }

/* gilded panel */
.frame { position: relative; background: linear-gradient(170deg, #4a3420, var(--wood-2)); border: 3px solid var(--gold); border-radius: 14px; box-shadow: inset 0 0 0 3px var(--gold-deep), inset 0 0 30px rgba(0,0,0,.55), 0 12px 30px rgba(0,0,0,.5); padding: 14px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; letter-spacing: .02em; text-wrap: balance; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-family: var(--f-display); font-size: 18px; letter-spacing: .03em; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.btn.green { background: linear-gradient(#86e06a, var(--green) 45%, var(--green-deep)); border: 2px solid #1f5216; box-shadow: 0 4px 0 #173f10; }
.btn.gold { background: linear-gradient(#ffe08a, #e0a93a 50%, #a8741d); border: 2px solid #6d4f17; box-shadow: 0 4px 0 #4a3510; color: #3a2508; text-shadow: none; }
.btn.gem { background: linear-gradient(#59e59b, #18a35a 55%, #0d6b3a); border: 2px solid #0a4a28; box-shadow: 0 4px 0 #083a20; }
.btn.ad { background: linear-gradient(#5aa9ff, #2f6fd6 55%, #1d4aa0); border: 2px solid #142f66; box-shadow: 0 4px 0 #10264f; }
.btn.dark { background: linear-gradient(#5a4430, #33251a); border: 2px solid #1a120b; box-shadow: 0 4px 0 #120c07; color: var(--parch); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
.btn.poor { filter: saturate(.35) brightness(.85); }
.btn .sub { font-family: var(--f-body); font-size: 12px; font-weight: 900; opacity: .9; }

/* home */
#home { justify-content: space-between; }
.logo { text-align: center; line-height: .9; }
.logo h1 { font-size: clamp(44px, 9vw, 92px); color: #ffe7a3; -webkit-text-stroke: 2px #4a2a05; text-shadow: 0 5px 0 #5c3608, 0 0 28px rgba(178,107,255,.75); transform: rotate(-2deg); }
.logo p { margin: 8px 0 0; font-size: clamp(13px, 2vw, 17px); color: var(--parch); text-shadow: 0 2px 4px #000; }
.home-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.home-actions .btn { min-width: 150px; min-height: 54px; font-size: 22px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.foot .demo { background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 6px; }

/* levels */
.worlds { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { padding: 7px 14px; border-radius: 10px; font-family: var(--f-display); font-size: 16px; background: linear-gradient(#5a4430, #33251a); border: 2px solid #1a120b; color: var(--muted); }
.tab[aria-selected="true"] { background: linear-gradient(#ffe08a, #d39a2e); color: #3a2508; border-color: #6d4f17; }
.tab:disabled { opacity: .45; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.lvl { aspect-ratio: 1.25; max-width: 100%; border-radius: 12px; background: linear-gradient(#6b4d2d, #3a2817); border: 2px solid var(--gold-deep); box-shadow: 0 4px 0 #1b120a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--f-display); font-size: 24px; }
.lvl.locked { filter: grayscale(1) brightness(.55); }
.lvl.boss { border-color: var(--aura); }
.lvl .s { display: flex; gap: 2px; }
.star { width: 14px; height: 14px; background: #2a1d12; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
.star.on { background: linear-gradient(#fff3a6, #f5b400); }
.world-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.world-name span { color: var(--muted); font-size: 13px; }

/* shop */
.shop-body { flex: 1; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 12px; min-height: 0; }
.showroom { position: relative; border-radius: 14px; overflow: hidden; min-height: 220px; background: radial-gradient(ellipse at 50% 80%, rgba(255,190,90,.25), transparent 60%); }
#pv { width: 100%; height: 100%; display: block; position: absolute; inset: 0; }
.stats { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.stats span { background: rgba(0,0,0,.55); border: 1px solid rgba(230,187,90,.5); padding: 3px 7px; border-radius: 7px; }
.shop-panel { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.card { flex: 1; display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; grid-template-rows: auto auto; align-items: center; gap: 8px 6px; }
.card .nav { height: 60px; border-radius: 10px; font-family: var(--f-display); font-size: 26px; color: var(--gold); background: rgba(0,0,0,.3); }
.showcase { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; text-align: center; }
.icon-well { width: 100%; max-width: 100%; height: 96px; border-radius: 10px; background: radial-gradient(ellipse at center, #3c3c48, #101015 75%); border: 2px solid #1a120b; position: relative; }
#icon { width: 100%; height: 100%; display: block; }
.count { position: absolute; top: 6px; right: 8px; font-size: 11px; color: var(--muted); }
.tag { position: absolute; top: 6px; left: 8px; font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 900; letter-spacing: .05em; }
.tag.p2w { background: var(--red); color: #fff; }
.tag.own { background: var(--green); color: #102b0a; }
.showcase h3 { font-size: 24px; color: #ffe7a3; -webkit-text-stroke: 1px #3a2508; }
.showcase p { margin: 0; color: var(--parch); font-size: 13px; max-width: 42ch; }
.buy { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.adbtn { flex-direction: column; gap: 3px; padding: 4px 14px 6px; }
.adbtn .meter { width: 120px; height: 6px; border-radius: 3px; background: rgba(0,0,0,.45); overflow: hidden; }
.adbtn .meter i { display: block; height: 100%; background: #ffd23f; }

/* gem store */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 10px 10px; border-radius: 14px; background: linear-gradient(#4a3420, #2a1c10); border: 2px solid var(--gold-deep); text-align: center; }
.pack.hot { border-color: var(--gold); box-shadow: 0 0 18px rgba(230,187,90,.45); }
.pack .ribbon { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--red); color: #fff; font-size: 11px; font-weight: 900; padding: 2px 8px; border-radius: 6px; letter-spacing: .04em; }
.pack .amt { font-family: var(--f-display); font-size: 26px; color: #c9ffe0; display: flex; align-items: center; gap: 6px; }
.pack p { margin: 0; font-size: 12px; color: var(--muted); min-height: 2.6em; }
.pack .btn { width: 100%; }
.timer { font-variant-numeric: tabular-nums; color: #ffd23f; }

/* modals */
.modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,3,1,.7); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; z-index: 20; overflow-y: auto; }
.modal .frame { width: min(440px, 100%); display: flex; flex-direction: column; gap: 10px; text-align: center; }
.modal h2 { font-size: 30px; color: #ffe7a3; -webkit-text-stroke: 1px #3a2508; }
.modal p { margin: 0; color: var(--parch); }
.modal .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.modal .row .btn { flex: 1 1 140px; }
.big-stars { display: flex; justify-content: center; gap: 8px; }
.big-stars .star { width: 46px; height: 46px; }
.big-stars .star.on { animation: pop .45s cubic-bezier(.3,1.8,.5,1) both; }
.big-stars .star:nth-child(2) { animation-delay: .18s; } .big-stars .star:nth-child(3) { animation-delay: .36s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.tally { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.3); border-radius: 10px; padding: 10px 12px; }
.tally b { display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end; }
.lose { color: var(--red); }

/* fake ad */
#ad { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #05060a; padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#ad .ad-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: #aab; }
#ad .ad-close { min-width: 44px; min-height: 36px; border-radius: 18px; background: rgba(255,255,255,.12); color: #fff; padding: 0 14px; font-weight: 900; }
#ad .ad-body { flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; text-align: center; }
#ad canvas { width: 180px; height: 180px; }
#ad h2 { font-size: clamp(28px, 6vw, 52px); }
#ad p { margin: 6px 0 0; font-size: 18px; color: #dde; max-width: 30ch; }
#ad .ad-cta { margin-top: 14px; }
#ad .ad-progress { height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden; }
#ad .ad-progress i { display: block; height: 100%; width: 0; background: #ffd23f; }

/* in-run hud */
#hud .bar { justify-content: flex-end; }
#toast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: rgba(15,10,5,.92); border: 2px solid var(--gold); border-radius: 12px; padding: 9px 16px; max-width: calc(100% - 32px); text-align: center; pointer-events: none; transition: opacity .25s; }

@media (max-width: 640px) and (orientation: portrait) {
  .shop-body { grid-template-columns: minmax(0, 1fr); }
  .showroom { min-height: 200px; }
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-height: 420px) {
  .screen { gap: 6px; }
  .icon-well { height: 70px; }
  .showcase h3 { font-size: 20px; }
  .showcase p { font-size: 12px; }
  .lvl { aspect-ratio: 1.6; font-size: 20px; }
  .logo h1 { font-size: clamp(40px, 12vh, 80px); }
}
@media (prefers-reduced-motion: reduce) { .big-stars .star.on { animation: none; } }
</style>

<canvas id="cv" aria-label="Aura Knight game"></canvas>

<section id="home" class="screen">
  <div class="bar"><div class="spacer"></div><div data-bar></div></div>

  </div>

    <button class="btn dark" id="b-mute" style="min-height:34px;font-size:14px">Sound on</button>

</section>

<section id="levels" class="screen" hidden>

</section>

<section id="shop" class="screen" hidden>
  <div class="bar"><button class="iconbtn" data-back aria-label="Back">‹</button><h2 style="font-size:24px">Armory</h2><div class="spacer"></div><div data-bar></div></div>
  <div class="shop-body">
    <div class="showroom"><canvas id="pv"></canvas><div class="stats" id="stats"></div></div>
    <div class="shop-panel frame">
      <div class="cats" id="cats" role="tablist"></div>
      <div class="card">
        <button class="nav" id="prev" aria-label="Previous item">‹</button>

          <div class="icon-well"><canvas id="icon"></canvas><span class="count" id="count"></span><span class="tag" id="tag" hidden></span></div>
          <h3 id="iname"></h3>

        </div>

        <div class="buy" id="buy"></div>
      </div>

  </div>
</section>

<section id="gems" class="screen" hidden>
  <div class="bar"><button class="iconbtn" data-back aria-label="Back">‹</button><h2 style="font-size:24px">Gem shop</h2><div class="spacer"></div><div data-bar></div></div>
  <div class="packs" id="packs"></div>
</section>

<section id="hud" class="screen clear" hidden>

</section>

  </div>
</div>

<script>
'use strict';
/* =====================================================================
   Aura Knight: an auto-runner with a pay-to-win armory and an ad path.
   Everything is in this one file so it runs in a browser and inside the
   Expo app's WebView. The app passes saves in through window.__AK_SAVE__
   and receives them through window.ReactNativeWebView.postMessage.
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = n => Math.floor(n).toLocaleString('en-US');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const RN = window.ReactNativeWebView;
const send = msg => { try { RN && RN.postMessage(JSON.stringify(msg)); } catch (e) {} };

/* ---------------- catalog ---------------- */
const CATS = [['all', 'All'], ['sword', 'Swords'], ['armor', 'Armor'], ['shield', 'Shields'], ['skin', 'Skins']];
// price: aura = soft currency, gems = premium, ads = number of rewarded ads that unlock it instead
const ITEMS = [
  { id: 'stick', cat: 'sword', name: 'Wooden Stick', desc: 'Every legend starts somewhere. This is that somewhere.', price: {}, s: { range: 44, cd: .4 } },
  { id: 'iron', cat: 'sword', name: 'Iron Sword', desc: 'Longer reach. Mid aura, but honest.', price: { aura: 2000 }, s: { range: 56, cd: .34 } },
  { id: 'katana', cat: 'sword', name: 'Drip Katana', desc: 'Slashes twice as fast. The drip is a free bonus.', price: { aura: 8000, ads: 8 }, s: { range: 60, cd: .2 } },
  { id: 'diamond', cat: 'sword', name: 'Diamond Sword', desc: 'Shoots unstoppable magic missiles when you slash.', price: { aura: 20000, gems: 300, ads: 15 }, s: { range: 62, cd: .26, missiles: 1 }, p2w: true },
  { id: 'sigma', cat: 'sword', name: 'Sigma Blade', desc: 'Three missiles per swing and it slashes by itself. Pure pay to win.', price: { gems: 900 }, s: { range: 72, cd: .2, missiles: 3, auto: true }, p2w: true },
  { id: 'cardboard', cat: 'armor', name: 'Cardboard Armor', desc: 'Three hearts. Smells like a delivery box.', price: {}, s: { hearts: 3, color: '#b98a52', mult: 1 } },
  { id: 'chain', cat: 'armor', name: 'Chainmail', desc: 'Four hearts. Jingles when you run.', price: { aura: 3000, ads: 6 }, s: { hearts: 4, color: '#9aa1ad', mult: 1 } },
  { id: 'plate', cat: 'armor', name: 'Gyatt Plate', desc: 'Five hearts. Built different.', price: { aura: 12000, gems: 200, ads: 12 }, s: { hearts: 5, color: '#5d86c9', mult: 1 } },
  { id: 'golden', cat: 'armor', name: 'Golden Mewing Armor', desc: 'Six hearts and double aura from everything you collect.', price: { gems: 600 }, s: { hearts: 6, color: '#f1c232', mult: 2 }, p2w: true },
  { id: 'noshield', cat: 'shield', name: 'No Shield', desc: 'Raw dogging the dungeon.', price: {}, s: { blocks: 0 } },
  { id: 'mewshield', cat: 'shield', name: 'Mewing Shield', desc: 'Blocks the first hit in every level. Jawline intact.', price: { aura: 5000, ads: 8 }, s: { blocks: 1, color: '#4aa3ff' } },
  { id: 'bubble', cat: 'shield', name: 'Aura Bubble', desc: 'Blocks three hits in every level. Haters can’t touch you.', price: { gems: 250 }, s: { blocks: 3, color: '#b26bff' }, p2w: true },
  { id: 'classic', cat: 'skin', name: 'Classic Knight', desc: 'Blue stripes, blue plume. The OG fit.', price: {}, s: { tunic: ['#2f6fd6', '#f4f1e8'], plume: '#2f6fd6' } },
  { id: 'npc', cat: 'skin', name: 'NPC Grey', desc: 'Blend in. Nobody will notice you. That’s the joke.', price: { aura: 1500 }, s: { tunic: ['#8b8f98', '#6c7079'], plume: '#a7abb3' } },
  { id: 'sixseven', cat: 'skin', name: 'Six Seven', desc: 'Six. Seven. You know exactly why.', price: { aura: 6767, ads: 5 }, s: { tunic: ['#ff7a1a', '#1b1b1f'], plume: '#ff7a1a' } },
  { id: 'rizz', cat: 'skin', name: 'Rizz Gold', desc: 'A drip so loud enemies hear it first.', price: { gems: 150 }, s: { tunic: ['#f1c232', '#7a1fa8'], plume: '#ff3fa4' } },
];
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));

const PACKS = [

/* ---------------- level generation ---------------- */
const EN_SIZE = { sharko: [36, 24], cappu: [24, 30], pigeon: [28, 18], boss: [80, 56] };
function genLevel(n) {
  const r = rng(n * 7919 + 13), d = (n - 1) / (LEVELS - 1), w = Math.floor((n - 1) / 10);
  const L = { n, w, ground: [], plats: [], spikes: [], orbs: [], gems: [], picks: [], en: [], speed: 205 + n * 3.2, boss: n % 10 === 0 };
  let x = 0;
  const solid = len => { const last = L.ground[L.ground.length - 1]; if (last && last[1] === x) last[1] += len; else L.ground.push([x, x + len]); x += len; };
  const orbLine = (x0, k, y, dx = 28) => { for (let i = 0; i < k; i++) L.orbs.push({ x: x0 + i * dx, y }); };
  const orbArc = (x0, wd, k, h) => { for (let i = 0; i < k; i++) { const q = i / (k - 1); L.orbs.push({ x: x0 + q * wd, y: GROUND - 26 - Math.sin(q * Math.PI) * h }); } };
  const types = [['sharko', 'pigeon'], ['sharko', 'cappu', 'pigeon'], ['sharko', 'cappu', 'pigeon']][w];
  const enemy = (ex) => {
    const t = types[Math.floor(r() * types.length)];
    const e = { type: t, x: ex, t: r() * 6, hp: t === 'sharko' && w >= 2 ? 2 : 1, dead: null };
    if (t === 'sharko') { e.vx = -45; e.y = GROUND - 12; }
    if (t === 'cappu') { e.vx = -25; e.y = GROUND - 15; }
    if (t === 'pigeon') { e.vx = -65; e.low = r() < .55; e.base = e.low ? GROUND - 22 : GROUND - 66; e.y = e.base; }
    L.en.push(e);
  };
  solid(560); orbLine(280, 6, GROUND - 26);
  const target = 2300 + n * 250;
  while (x < target) {
    const k = pickW(r, [['flat', 2.5], ['pit', 3 + 3 * d], ['spikes', 2 + 2 * d], ['enemy', 3 + 2.5 * d], ['plat', 1 + 2 * d], ['arc', 2], ['double', 3 * d], ['sigma', .35]]);
    if (k === 'flat') { const len = 150 + r() * 120; orbLine(x + 30, Math.floor(len / 42), GROUND - 26, 30); solid(len); }
    else if (k === 'pit') { const gw = 60 + r() * (45 + 75 * d); orbArc(x - 10, gw + 20, 5, 70); x += gw; solid(140 + r() * 80); }
    else if (k === 'spikes') { solid(80); const sw = 32 + Math.floor(r() * (2 + d * 2)) * 16; L.spikes.push({ x, w: sw }); orbArc(x - 24, sw + 48, 4, 78); solid(sw); solid(120 + r() * 60); }
    else if (k === 'enemy') { solid(60); enemy(x + 180 + r() * 60); if (d > .4 && r() < d) enemy(x + 260 + r() * 60); solid(240 + r() * 70); }
    else if (k === 'plat') { solid(40); const gw = 230 + r() * 60, x0 = x; x += gw; L.plats.push({ x: x0 + gw / 2 - 55, y: GROUND - 56, w: 110 }); orbLine(x0 + gw / 2 - 42, 4, GROUND - 80, 28); if (r() < .3) L.gems.push({ x: x0 + gw / 2, y: GROUND - 150 }); solid(150); }
    else if (k === 'arc') { solid(60); orbArc(x + 40, 160, 6, 95); if (r() < .25) L.gems.push({ x: x + 120, y: GROUND - 140 }); solid(240); }
    else if (k === 'double') { solid(40); x += 70 + r() * 20; solid(70); x += 80 + r() * 30; orbLine(x - 60, 3, GROUND - 100, 26); solid(160); }
    else if (k === 'sigma') { solid(60); L.picks.push({ x: x + 60, y: GROUND - 60, kind: 'sigma' }); solid(200); }
  }
  if (L.boss) { solid(200); L.en.push({ type: 'boss', x: x + 380, y: GROUND - 26, vx: 0, t: 0, hp: 6 + w * 3, max: 6 + w * 3, dead: null, boss: true }); solid(700); }
  solid(160); L.finish = x; solid(900);
  return L;
}

    txt(c, 'TAP RIGHT: SLASH', W * .75, 340, 13, '#fff');
    c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(W / 2 - 1, 230, 2, 120);
    c.globalAlpha = 1;
  }
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now; T += dt;
  if (G && G.state === 'play' && !paused) update(dt);
  render();
  if (!$('#shop').hidden) drawPreview();
  requestAnimationFrame(frame);
}

/* ---------------- input ---------------- */
cv.addEventListener('pointerdown', e => {
  if (!G || G.state !== 'play') return;
  e.preventDefault();
  if (e.clientX < innerWidth / 2) jump(); else slash();
});
$('#hud').addEventListener('pointerdown', e => {
  if (e.target.closest('button') || !G || G.state !== 'play') return;
  if (e.clientX < innerWidth / 2) jump(); else slash();
});
addEventListener('keydown', e => {
  if (!G || G.state !== 'play') return;
  if (['Space', 'ArrowUp', 'KeyW', 'KeyZ'].includes(e.code)) { e.preventDefault(); jump(); }
  if (['KeyX', 'KeyJ', 'ArrowRight', 'Enter'].includes(e.code)) { e.preventDefault(); slash(); }
  if (e.code === 'Escape' || e.code === 'KeyP') pauseModal();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.state === 'play' && !paused) pauseModal(); });

/* ---------------- screens and ui ---------------- */
let backStack = ['home'];
function show(id, push) {
  $$('.screen').forEach(s => s.hidden = s.id !== id);
  if (push) backStack.push(id); else if (id === 'home') backStack = ['home'];
  if (id !== 'hud') { G = id === 'home' || id === 'levels' || id === 'shop' || id === 'gems' ? null : G; }
  renderBars();
  if (id === 'levels') renderLevels();
  if (id === 'shop') renderShop();
  if (id === 'gems') renderPacks();
}
function back() { backStack.pop(); show(backStack[backStack.length - 1] || 'home'); }
$$('[data-back]').forEach(b => b.onclick = back);
$('#b-play').onclick = () => show('levels', true);
$('#b-shop').onclick = () => show('shop', true);
$('#b-gems').onclick = () => show('gems', true);
$('#b-mute').onclick = () => { S.muted = !S.muted; save(); $('#b-mute').textContent = S.muted ? 'Sound off' : 'Sound on'; };
$('#b-mute').textContent = S.muted ? 'Sound off' : 'Sound on';
$('#b-pause').onclick = pauseModal;

function renderBars() {
  tickEnergy();
  const html = `<div class="bar">
    <span class="res"><i class="ico bolt"></i><b>${S.energy}/${maxEnergy()}</b>${S.energy < maxEnergy() ? `<small>${mmss(energyLeftMs())}</small>` : ''}<button class="plus" data-act="energy" aria-label="Get energy">+</button></span>
    <span class="res"><i class="ico aura"></i><b>${fmt(S.aura)}</b></span>
    <span class="res"><i class="ico gem"></i><b>${fmt(S.gems)}</b><button class="plus" data-act="gems" aria-label="Buy gems">+</button></span></div>`;
  $$('[data-bar]').forEach(el => { el.innerHTML = html; });
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'gems') show('gems', true);
  if (a.dataset.act === 'energy') energyModal();
});
setInterval(() => { if (!G) { const before = S.energy; tickEnergy(); if ($('#home').hidden === false || !$('#levels').hidden || !$('#shop').hidden || !$('#gems').hidden) renderBars(); if (before !== S.energy && !$('#levels').hidden) renderLevels(); } }, 1000);

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200); }

/* modal helper: buttons = [{label, cls, on, disabled, html}] */
function modal(html, buttons, opts = {}) {
  const m = $('#modal'), b = $('#mbody');
  b.innerHTML = html + `<div class="row">${buttons.map((x, i) => `<button class="btn ${x.cls || 'dark'}" data-i="${i}" ${x.disabled ? 'disabled' : ''}>${x.label}</button>`).join('')}</div>`;
  b.querySelectorAll('[data-i]').forEach(el => el.onclick = () => { const x = buttons[+el.dataset.i]; if (!x.keep) closeModal(); x.on && x.on(); });
  m.hidden = false; m.onclick = opts.dismiss ? (e => { if (e.target === m) closeModal(); }) : null;
}
function closeModal() { $('#modal').hidden = true; }

/* ---------------- ads (simulated) ---------------- */
function canWatchAd() { dailyReset(); return S.adsToday < AD_CAP; }
function showAd(kind, done) {
  // kind: 'rewarded' (reward after it finishes) or 'forced' (interstitial between levels)
  if (kind === 'rewarded' && !canWatchAd()) { toast('Daily ad limit reached. Come back tomorrow, or skip the wait with gems.'); return; }
  send({ type: 'ad', kind });
  const ad = FAKE_ADS[Math.floor(Math.random() * FAKE_ADS.length)];
  const el = $('#ad'), close = $('#ad-close'), bar = $('#ad-bar');
  el.style.background = `linear-gradient(135deg, ${ad.bg[0]}, ${ad.bg[1]})`;
  $('#ad-brand').textContent = ad.brand; $('#ad-line').textContent = ad.line; $('#ad-cta').textContent = ad.cta;
  $('#ad-label').textContent = kind === 'rewarded' ? 'Ad · simulated · reward after the countdown' : 'Ad · simulated · VIP removes these';
  el.hidden = false;
  const dur = kind === 'rewarded' ? 5 : 4, t0 = performance.now();
  const ac = $('#ad-cv').getContext('2d');
  let raf = 0;
  const tick = () => {
    const s = (performance.now() - t0) / 1000;
    ac.setTransform(1, 0, 0, 1, 0, 0); ac.clearRect(0, 0, 360, 360);
    ac.fillStyle = 'rgba(255,255,255,.12)'; ac.beginPath(); ac.arc(180, 180, 150 + Math.sin(s * 4) * 6, 0, Math.PI * 2); ac.fill();
    if (ad.mascot === 'knight') drawKnight(ac, 180, 280, s, S.equip, { scale: 3.6 });
    else drawEnemy(ac, ad.mascot, 180, 190, s, { scale: 5.5 });
    bar.style.width = Math.min(100, s / dur * 100) + '%';
    const left = Math.max(0, Math.ceil(dur - s));
    if (left > 0) { close.disabled = true; close.textContent = kind === 'rewarded' ? `Reward in ${left}` : `Skip in ${left}`; }
    else { close.disabled = false; close.textContent = kind === 'rewarded' ? 'Claim reward ✕' : 'Close ✕'; }
    raf = requestAnimationFrame(tick);
  };
  tick();
  $('#ad-cta').onclick = () => toast('This is a pretend ad. Nothing to install.');
  close.onclick = () => {
    if (close.disabled) return;
    cancelAnimationFrame(raf); el.hidden = true;
    if (kind === 'rewarded') { S.adsToday++; save(); }
    done && done();
  };
}

/* ---------------- purchases (simulated) ---------------- */
function buyReal(pack, done) {
  modal(`<h2>${pack.label}</h2><p>${pack.desc}</p><p style="font-size:12px;color:var(--muted)">Demo purchase. No money is charged. In the App Store build this opens Apple's payment sheet.</p>`,
    [{ label: 'Cancel' }, { label: `Pay ${pack.price}`, cls: 'green', on: () => { send({ type: 'purchase', sku: pack.id }); done(); save(); renderBars(); } }], { dismiss: true });
}

/* ---------------- level select ---------------- */
let worldTab = 0;
function renderLevels() {
  const unlockedWorld = Math.floor(S.cleared / 10);
  $('#worlds').innerHTML = WORLDS.map((w, i) => `<button class="tab" role="tab" aria-selected="${i === worldTab}" data-w="${i}" ${i > unlockedWorld ? 'disabled' : ''}>${i + 1}. ${w.name}</button>`).join('');
  $$('#worlds [data-w]').forEach(b => b.onclick = () => { worldTab = +b.dataset.w; renderLevels(); });
  $('#wname').innerHTML = `${WORLDS[worldTab].name} <span>${WORLDS[worldTab].note}</span>`;
  let h = '';
  for (let i = 1; i <= 10; i++) {
    const n = worldTab * 10 + i, st = S.stars[n] || 0, locked = n > S.cleared + 1;
    h += `<button class="lvl ${locked ? 'locked' : ''} ${n % 10 === 0 ? 'boss' : ''}" data-l="${n}" ${locked ? 'aria-disabled="true"' : ''} aria-label="Level ${n}${locked ? ', locked' : ''}">
      ${locked ? '🔒' : n}<span class="s">${[1, 2, 3].map(k => `<i class="star ${k <= st ? 'on' : ''}"></i>`).join('')}</span></button>`;
  }
  $('#lgrid').innerHTML = h;
  $$('#lgrid [data-l]').forEach(b => b.onclick = () => {
    const n = +b.dataset.l;
    if (n > S.cleared + 1) { toast('Clear level ' + (S.cleared + 1) + ' first.'); return; }
    startLevel(n);
  });
}

/* ---------------- run modals ---------------- */
function pauseModal() {
  if (!G || G.state !== 'play') return;
  paused = true;
  modal(`<h2>Paused</h2><p>Quitting now loses the ${fmt(G.runAura)} aura from this run and the energy you spent.</p>`,
    [{ label: 'Quit', on: () => { G = null; paused = false; show('levels'); } }, { label: 'Resume', cls: 'green', on: () => { paused = false; } }]);
}
function reviveModal() {
  const cost = 10 * Math.pow(2, G.revives);
  modal(`<h2>You lost your aura</h2><p>Revive now and keep the <b>${fmt(G.runAura)}</b> aura you farmed this run. Give up and it's gone.</p>`, [
    { label: `Revive <i class="ico gem"></i> ${cost}`, cls: 'gem' + (S.gems < cost ? ' poor' : ''), on: () => {
      if (S.gems < cost) { toast('Not enough gems.'); show('gems', true); G = null; return; }
      S.gems -= cost; save(); revive(); } },
    { label: `<i class="ico ad">AD</i> Watch ad to revive`, cls: 'ad', disabled: G.adRevive, on: () => showAd('rewarded', () => { G.adRevive = true; revive(); }) },
    { label: 'Give up', on: () => { G = null; show('levels'); } },
  ]);
}
function revive() {
  G.revives++; G.hp = G.maxHp; G.state = 'play';
  const p = G.p; p.inv = 2;
  if (p.y > GROUND + 4) respawnAhead();
  G.L.en.forEach(e => { if (e.dead == null && !e.boss && e.x > p.x - 40 && e.x < p.x + 260) { e.dead = 0; } });
  pop('BACK FROM THE DEAD', p.x + 40, p.y - 90, '#ffe7a3', 22);
}
function win() {
  G.state = 'won'; sfx('win');
  const L = G.L, pct = L.orbs.length ? G.orbsTaken / L.orbs.length : 1;
  const stars = 1 + (pct >= .5 ? 1 : 0) + (pct >= .8 && G.hits <= 1 ? 1 : 0);
  const bonus = (50 + G.n * 15) * (S.vip ? 2 : 1);
  const earned = G.runAura + bonus, n = G.n, gems = G.runGems;
  S.aura += earned; S.gems += gems; S.stars[n] = Math.max(S.stars[n] || 0, stars); S.cleared = Math.max(S.cleared, n); S.sinceAd++;
  save();
  let doubled = false;
  const go = (next) => {
    const cont = () => { G = null; if (next && n < LEVELS) startLevel(n + 1); else { worldTab = Math.floor(Math.min(n, LEVELS - 1) / 10); show('levels'); } };
    if (!S.vip && S.sinceAd >= 3) { S.sinceAd = 0; save(); showAd('forced', cont); } else cont();
  };
  const render = () => modal(`<h2>Level ${n} cleared</h2>
    <div class="big-stars">${[1, 2, 3].map(k => `<i class="star ${k <= stars ? 'on' : ''}"></i>`).join('')}</div>
    <div class="tally">
      <span>Aura farmed</span><b><i class="ico aura"></i>${fmt(G.runAura)}</b>
      <span>Clear bonus${S.vip ? ' (VIP x2)' : ''}</span><b><i class="ico aura"></i>${fmt(bonus)}</b>
      ${gems ? `<span>Gems found</span><b><i class="ico gem"></i>${gems}</b>` : ''}
      ${doubled ? `<span>Ad bonus</span><b><i class="ico aura"></i>${fmt(earned)}</b>` : ''}
    </div>`, [
    { label: doubled ? 'Doubled ✓' : `<i class="ico ad">AD</i> Double to ${fmt(earned * 2)}`, cls: 'ad', disabled: doubled, keep: true, on: () => showAd('rewarded', () => { doubled = true; S.aura += earned; save(); renderBars(); render(); }) },
    { label: 'Levels', on: () => go(false) },
    { label: n < LEVELS ? 'Next level' : 'Finish', cls: 'green', on: () => go(true) },
  ]);
  setTimeout(render, 500);
}
function energyModal() {
  tickEnergy();
  const full = S.energy >= maxEnergy();
  modal(`<h2>Energy</h2><p>${full ? 'Your energy is full.' : `You have ${S.energy} of ${maxEnergy()}. The next one arrives in ${mmss(energyLeftMs())}.`}</p>`, [
    { label: `Refill <i class="ico gem"></i> 30`, cls: 'gem' + (S.gems < 30 ? ' poor' : ''), disabled: full, on: () => { if (S.gems < 30) { toast('Not enough gems.'); show('gems', true); return; } S.gems -= 30; S.energy = maxEnergy(); save(); renderBars(); toast('Energy refilled.'); } },
    { label: `<i class="ico ad">AD</i> +1 energy`, cls: 'ad', disabled: full, on: () => showAd('rewarded', () => { S.energy = Math.min(maxEnergy(), S.energy + 1); save(); renderBars(); toast('+1 energy'); }) },
    { label: 'Close' },
  ], { dismiss: true });
}

/* ---------------- armory ---------------- */
let shopCat = 'all', shopIdx = 0, pvCtx = null, icCtx = null;
const shopList = () => ITEMS.filter(i => shopCat === 'all' || i.cat === shopCat);
function sizeCanvas(cvs) { const r = cvs.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr)); if (cvs.width !== w || cvs.height !== h) { cvs.width = w; cvs.height = h; } return [w, h]; }
function tryOnEquip() { const it = shopList()[shopIdx]; return it ? Object.assign({}, S.equip, { [it.cat]: it.id }) : S.equip; }
function drawPreview() {
  const pv = $('#pv'); const [w, h] = sizeCanvas(pv); pvCtx = pvCtx || pv.getContext('2d');
  const c = pvCtx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
  const s = Math.min(w / 110, h / 115);
  const fy = h * .8;
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(w / 2, fy, 30 * s, 6 * s, 0, 0, Math.PI * 2); c.fill();
  drawKnight(c, w / 2 - 4 * s, fy, T, tryOnEquip(), { run: false, scale: s, slash: (T % 2.4) < .18 ? .18 - (T % 2.4) : 0 });
  const ic = $('#icon'); const [iw, ih] = sizeCanvas(ic); icCtx = icCtx || ic.getContext('2d');
  const d = icCtx; d.setTransform(1, 0, 0, 1, 0, 0); d.clearRect(0, 0, iw, ih);
  const it = shopList()[shopIdx]; if (!it) return;
  const k = ih / 60;
  d.save(); d.translate(iw / 2, ih / 2);
  if (it.cat === 'sword') { d.scale(k * 1.5, k * 1.5); d.rotate(Math.PI / 2 + Math.sin(T * 2) * .08); d.translate(0, 16); drawSword(d, it.id); }
  else if (it.cat === 'shield') { d.scale(k, k); if (it.id === 'noshield') { d.strokeStyle = '#666'; d.lineWidth = 3; d.beginPath(); d.arc(0, 0, 16, 0, Math.PI * 2); d.moveTo(-11, 11); d.lineTo(11, -11); d.stroke(); } else drawShield(d, it.id, 20); }
  else { d.restore(); d.save(); const eq = Object.assign({}, S.equip, { [it.cat]: it.id }); drawKnight(d, iw / 2, ih * .95, T, eq, { run: false, scale: k * .9 }); }
  d.restore();
}
function renderShop() {
  const list = shopList(); shopIdx = clamp(shopIdx, 0, list.length - 1);
  const it = list[shopIdx];
  $('#cats').innerHTML = CATS.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === shopCat}" data-c="${k}">${l}</button>`).join('');
  $$('#cats [data-c]').forEach(b => b.onclick = () => { shopCat = b.dataset.c; shopIdx = 0; renderShop(); });
  $('#count').textContent = `${shopIdx + 1} / ${list.length}`;
  $('#iname').textContent = it.name; $('#idesc').textContent = it.desc;
  const owned = !!S.owned[it.id], equipped = S.equip[it.cat] === it.id;
  const tag = $('#tag'); tag.hidden = !(owned || it.p2w); tag.className = 'tag ' + (owned ? 'own' : 'p2w'); tag.textContent = owned ? 'OWNED' : 'PAY TO WIN';
  const g = gearWith(tryOnEquip());
  $('#stats').innerHTML = `<span>♥ ${g.hearts} hearts</span><span>Reach ${g.sword.range}</span><span>${(1 / g.sword.cd).toFixed(1)} slashes/s</span>${g.sword.missiles ? `<span>${g.sword.missiles} missile${g.sword.missiles > 1 ? 's' : ''}</span>` : ''}${g.sword.auto ? '<span>Auto-slash</span>' : ''}${g.blocks ? `<span>Blocks ${g.blocks}</span>` : ''}${g.mult > 1 ? `<span>x${g.mult} aura</span>` : ''}`;
  const buy = $('#buy'); let h = '';
  if (equipped) h = `<button class="btn dark" disabled>Equipped</button>`;
  else if (owned) h = `<button class="btn green" data-b="equip">Equip</button>`;
  else {
    const p = it.price;
    if (p.aura) h += `<button class="btn green ${S.aura < p.aura ? 'poor' : ''}" data-b="aura"><i class="ico aura"></i>${fmt(p.aura)}</button>`;
    if (p.gems) h += `<button class="btn gem ${S.gems < p.gems ? 'poor' : ''}" data-b="gems"><i class="ico gem"></i>${fmt(p.gems)}</button>`;
    if (p.ads) { const done = S.adProg[it.id] || 0; h += `<button class="btn ad adbtn" data-b="ad"><span><i class="ico ad">AD</i> Watch ads ${done}/${p.ads}</span><span class="meter"><i style="width:${done / p.ads * 100}%"></i></span></button>`; }
  }
  buy.innerHTML = h;
  buy.querySelectorAll('[data-b]').forEach(b => b.onclick = () => shopAction(it, b.dataset.b));
  drawPreview();
}
function gearWith(eq) { const ar = byId[eq.armor].s; return { sword: byId[eq.sword].s, hearts: ar.hearts, mult: ar.mult * (S.vip ? 2 : 1), blocks: byId[eq.shield].s.blocks }; }
function grant(it) { S.owned[it.id] = 1; S.equip[it.cat] = it.id; save(); sfx('win'); toast(`${it.name} unlocked and equipped.`); renderBars(); renderShop(); }
function shopAction(it, how) {
  const p = it.price;
  if (how === 'equip') { S.equip[it.cat] = it.id; save(); renderShop(); return; }
  if (how === 'aura') {
    if (S.aura < p.aura) {
      const need = p.aura - S.aura;
      modal(`<h2>Not enough aura</h2><p>You need ${fmt(need)} more aura. Farm it in levels${p.gems ? ', buy it with gems' : ''}${p.ads ? ', or unlock it with ads' : ''}.</p>`, [{ label: 'OK' }, ...(p.gems ? [{ label: 'Get gems', cls: 'gem', on: () => show('gems', true) }] : [])], { dismiss: true });
      return;
    }
    S.aura -= p.aura; grant(it); return;
  }
  if (how === 'gems') {
    if (S.gems < p.gems) { toast(`You need ${fmt(p.gems - S.gems)} more gems.`); show('gems', true); return; }
    S.gems -= p.gems; grant(it); return;
  }
  if (how === 'ad') showAd('rewarded', () => {
    S.adProg[it.id] = (S.adProg[it.id] || 0) + 1; save();
    if (S.adProg[it.id] >= p.ads) grant(it); else { toast(`${S.adProg[it.id]} of ${p.ads} ads watched for ${it.name}.`); renderShop(); }
  });
}
$('#prev').onclick = () => { const n = shopList().length; shopIdx = (shopIdx - 1 + n) % n; renderShop(); };
$('#next').onclick = () => { const n = shopList().length; shopIdx = (shopIdx + 1) % n; renderShop(); };

/* ---------------- gem shop ---------------- */
const STARTER_MS = 24 * 3600 * 1000;
function renderPacks() {
  dailyReset();
  const starterLeft = STARTER_MS - (Date.now() - S.firstSeen);
  const list = PACKS.filter(p => !(p.starter && (S.starter || starterLeft <= 0)) && !(p.vip && S.vip));
  $('#packs').innerHTML = list.map(p => `<div class="pack ${p.ribbon ? 'hot' : ''}">
    ${p.ribbon ? `<span class="ribbon">${p.ribbon}</span>` : ''}
    <h3 style="font-size:18px">${p.label}</h3>
    ${p.gems ? `<div class="amt"><i class="ico gem"></i>${fmt(p.gems)}</div>` : `<div class="amt" style="color:#ffd23f">VIP</div>`}
    <p>${p.desc}${p.starter ? `<br><span class="timer">Ends in ${hm(starterLeft)}</span>` : ''}</p>
    ${p.ad ? `<button class="btn ad" data-p="${p.id}" ${S.freeGemAds >= 5 ? 'disabled' : ''}><i class="ico ad">AD</i> ${S.freeGemAds}/5 today</button>` : `<button class="btn green" data-p="${p.id}">${p.price}</button>`}
  </div>`).join('');
  $$('#packs [data-p]').forEach(b => b.onclick = () => {
    const p = PACKS.find(x => x.id === b.dataset.p);
    if (p.ad) return showAd('rewarded', () => { S.freeGemAds++; S.gems += p.gems; save(); toast(`+${p.gems} gems`); renderBars(); renderPacks(); });
    buyReal(p, () => {
      if (p.gems) S.gems += p.gems;
      if (p.starter) { S.starter = true; S.owned.katana = 1; S.equip.sword = 'katana'; S.energy = maxEnergy(); }
      if (p.vip) { S.vip = true; S.energy = maxEnergy(); }
      toast(p.vip ? 'VIP active. No more forced ads.' : `+${fmt(p.gems)} gems`); renderPacks();
    });
  });
}

/* ---------------- boot ---------------- */
function start() {
  dailyReset(); resize(); show('home');
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('#shop').hidden) renderShop(); });
}
start();
</script>
